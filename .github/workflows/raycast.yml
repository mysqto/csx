name: raycast

on:
  push:
    branches: [main]
    paths: ["contrib/raycast/**", ".github/workflows/raycast.yml"]
  pull_request:
    paths: ["contrib/raycast/**", ".github/workflows/raycast.yml"]

jobs:
  check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: contrib/raycast/csx-tabs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contrib/raycast/csx-tabs/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx eslint src
      - run: npx prettier --check .
